; HumsiENK battery monitor for the CYD (Cheap Yellow Display, ESP32-2432S028R)
; Standalone: BLE-reads both batteries (WATT/HiLink), shows SOC/V on the TFT,
; and publishes to Home Assistant via MQTT discovery.
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0
    lovyan03/LovyanGFX @ ^1.1.16

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; PubSubClient default 256B buffer is too small for HA discovery JSON:
    -DMQTT_MAX_PACKET_SIZE=1024
    ; Max simultaneous BLE connections — must be >= number of batteries.
    ; NimBLE default is 3; raise this if you configure 4+ batteries.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
